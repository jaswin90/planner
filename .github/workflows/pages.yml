name: Test and publish the redirect

on:
  push:
    branches: [main, claude/vibrant-meitner-kjx5s3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build a redirect to the app's home on the site
        # The app is published by jaswin90/jaswin90.github.io at /apps/planner/ (it uses the
        # site-wide account). This repository's own Pages address forwards there, keeping #routes.
        run: |
          mkdir _site
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>My Planner has moved</title>
          <link rel="canonical" href="https://jaswin90.github.io/apps/planner/">
          <meta http-equiv="refresh" content="0; url=/apps/planner/">
          <script>location.replace('/apps/planner/' + location.hash);</script>
          </head><body><p>My Planner has moved to <a href="/apps/planner/">/apps/planner/</a>.</p></body></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
