<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- GitHub Pages cannot set HTTP headers, so the security policy lives here.
       Only this site's own files, the site account (Firebase, served from gstatic/googleapis)
       and Google's Drive endpoints are allowed. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self'; img-src 'self' blob:; media-src blob:; font-src 'self'; frame-src 'self' blob: https://jaswin-s-library.firebaseapp.com https://accounts.google.com https://apis.google.com; connect-src 'self' https://*.googleapis.com https://www.gstatic.com blob:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <!-- Origin only (never full URLs): Firebase's sign-in frame needs the origin to confirm the request comes from this site. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2f6fde">
  <title>My Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app" class="gate"><div class="gate-card"><p>Loading…</p></div></div>
  <noscript>This app needs JavaScript.</noscript>
</body>
</html>
